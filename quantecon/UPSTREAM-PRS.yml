    depends_on: []
    upstream:
      pr: null
      branch: null
      merged_sha: null
    notes: |
      Independent of book-mode work; can ship upstream any time. The
      upstream story pairs naturally with a small jupyter-book/myst-theme
      PR mapping list `style` to the <ol type> attribute (tracked in
      QuantEcon/mystmd#51) — mention it in the upstream PR description.

  - id: cite-code-span
    title: Citation scanner respects inline code-span boundaries
    type: feature
    description: |
      The citation rule's bracket branch regex-scans raw bracket text,
      so a backticked `@`-token (e.g. [wrap it in `@tf.function`])
      became a broken cite node that swallowed the code formatting.
      Adds CommonMark code-span range detection within the bracket and
      backs off when a matched `@` falls inside one.
    status: pending
    commits:
      - sha: 00740bc5
        local_pr: 53
        title: "Citation scanner respects inline code-span boundaries"
    depends_on: []
    upstream:
      pr: null
      branch: null
      merged_sha: null
    notes: |
      Upstream context documented in QuantEcon/mystmd#54. Key pitch for
      the upstream PR: the escaping direction floated in
      jupyter-book/mystmd#1618 cannot cover this shape — CommonMark
      makes backslashes literal inside code spans, so a backticked `@`
      cannot be escaped; code spans also bind tighter than brackets in
      CommonMark's own precedence. Complementary to (not competing
      with) #1618, which is the [@handle](url) link shape. Precedent:
      upstream merged the same kind of context-narrowing in
      jupyter-book/mystmd#2684 (URLs, their #2538) and #2891
      (@mention + HTML). The code-span shape is unreported upstream
      as of 2026-06-12.

  - id: proof-unnumbered
    title: prf:proof defaults to enumerated false (amsthm convention)
    type: feature
    description: |
      The bare proof / prf:proof directive defaults `enumerated: false`,
      matching LaTeX amsthm \begin{proof}; theorem-like kinds keep
      `enumerated: true` and `enumerated: true` opts a proof back in.
      Removes phantom enumerators that consumed counter slots without
      ever rendering.
    status: pending
    commits:
      - sha: 75e07a9a
        local_pr: 57
        title: "prf:proof defaults to enumerated: false (amsthm convention)"
    depends_on: []
    upstream:
      pr: null
      branch: null
      merged_sha: null
    notes: |
      Self-contained; myst-ext-proof was byte-identical to upstream/main
      before this commit, so the cherry-pick is clean. Mild behavior
      change for any upstream user who relied on numbered bare proofs —
      call out the `enumerated: true` opt-in in the upstream PR.

  - id: per-row-equation-numbering
    title: Per-row equation numbering for align/gather/alignat (amsmath semantics)
    type: feature
    description: |
      Each `\\` row of a non-starred align/gather/alignat advances the
      equation counter and takes its own number, rendered as per-row
      KaTeX `\tag{...}`s with the shared alignment axis preserved.
      `\nonumber`/`\notag` suppresses a row's number, `\tag{...}`
      replaces it without advancing the counter, a per-row `\label{...}`
      becomes that row's reference target, and starred environments are
      unnumbered. LaTeX export re-emits per-row labels so PDF numbering
      and anchors match HTML. Includes the katex ^0.15.2 → ^0.16.21
      bump (KaTeX 0.16.0 added the per-row \tag machinery this needs).
    status: pending
    commits:
      - sha: 756a4d5d
        local_pr: 81
        title: "Number align/gather/alignat rows per-row (amsmath semantics)"
    depends_on: []
    upstream:
      pr: null
      branch: null
      merged_sha: null
    notes: |
      Fork issues QuantEcon/mystmd#73 (feature analysis) and #80 (katex
      bump rationale) carry the full background. No upstream issue
      tracks this as of 2026-08-13; the strongest upstream pitch is
      that myst-to-tex passes align through verbatim, so PDF export
      already numbers per-row while HTML numbers per-block — mystmd
      disagrees with itself across its own outputs. The katex bump is
      independently useful upstream (same ^0.15.2 pin there); 0.16.x
      keeps the 0.15-era CSS class vocabulary so the katex@0.15.2
      stylesheet myst-theme hardcodes still applies — the 0.18 line
      renames CSS classes and must be a coordinated markup+CSS move
      (see quantecon-theme.mystmd#118).

      Cherry-pick caveat: the enumerate.ts changes (addMathRowTargets)
      sit textually inside fork-modified book-mode code and call the
      fork's incrementCount. The feature is logically independent of
      book mode, but expect context conflicts cherry-picking onto
      upstream/main — plan for a small rework against upstream's
      enumerate.ts rather than a clean replay, or bundle after
      book-mode-with-section-scope.

  - id: heading-attributes
    title: Pandoc-style heading attribute blocks ({#id .class .unnumbered})
    type: feature
    description: |
      Wires the inline-attribute tokenizer (upstream's own #1822, used
      by roles and directives) to ATX/setext headings via a markdown-it
      core rule. `.unnumbered` / `{-}` / `enumerated=false` map to
      `enumerated: false`, which the enumerate transform already honors:
      the heading keeps its target and TOC entry, renders no number,
      and does not advance the counter — LaTeX \section* semantics.
      `#id` becomes the heading label/identifier, `.class` lands on the
      node. A trailing brace block parses as attributes only when its
      entire content is recognized vocabulary, so prose braces and
      escaped \{ stay literal; opt out with
      `extensions.headingAttributes: false`.
    status: pending
    commits:
      - sha: a40f0cb0
        local_pr: 89
        title: "Heading attribute blocks: {#id .class .unnumbered} on ATX/setext headings"
    depends_on: []
    upstream:
      pr: null
      branch: null
      merged_sha: null
    notes: |
      Strong standalone candidate: completes upstream's existing
      inline-attribute mechanism rather than inventing fork syntax,
      uses pandoc's own heading-attribute notation (so pandoc- and
      LaTeX-converted content arrives already carrying the marker),
      and touches no fork-modified code paths — enumerate.ts is
      untouched, so the cherry-pick onto upstream/main should be
      clean. Fork context in QuantEcon/mystmd#68 and the #88 survey
      (24 wrongly-numbered starred headings in the Deep Learning
      book); downstream adoption tracked at
      QuantEcon/claude-latex-to-myst#160, which needs a qe-v10 tag
      cut over this feature first.

