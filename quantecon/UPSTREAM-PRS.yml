# QuantEcon mystmd → upstream PR tracker
#
# Each entry is a logical *upstream PR candidate* — a coherent feature
# that we plan to eventually open as a PR against jupyter-book/mystmd:main.
# A candidate may span multiple `main` squash commits (e.g. the original
# feature PR + later follow-up fixes, or several related features we want
# to bundle into one cohesive upstream review).
#
# `commits` is the ordered list of `main` squash SHAs to cherry-pick onto
# a fresh `upstream/<topic>` branch off `upstream/main`. Order matters —
# list them in dependency order so cherry-pick replays cleanly.
#
# Relationship to VERSION.yml: each `merge_sha` in VERSION.yml's
# `merged_features` should appear in some candidate's `commits` here.
# VERSION.yml is "what's in our main"; this file is "how we plan to ship
# it upstream."
#
# Status lifecycle:
#   planned  — candidate identified, commits may not all exist on main yet
#   pending  — all commits landed on main; upstream PR not yet opened
#   open     — upstream PR open, under review
#   merged   — upstream merged it (sync our main, then delete this entry's
#              `upstream/<topic>` branch if still around)

upstream_candidates:

  - id: myst-to-ipynb
    title: CommonMark ipynb export + image attachment embedding
    description: |
      Adds ipynb export with CommonMark output and inline image
      attachment embedding. Independent of book-mode work.
    status: pending
    commits:
      - sha: a045d57d
        local_pr: 16
        title: "feat(ipynb): CommonMark ipynb export + image attachment embedding"
    depends_on: []
    upstream:
      pr: null
      branch: null      # set when the upstream/<topic> branch is pushed
      merged_sha: null
    notes: |
      Self-contained; can ship upstream any time.

  - id: book-mode-with-section-scope
    title: Book-style numbering (with LaTeX-style section scope and counter sharing)
    description: |
      Bundles the original book-mode work (#22) with the section-scope
      extension (#28), the heading-chain follow-up (#33), and the
      shared-counter extension (#40). All four form one coherent story
      upstream — #28 builds on #22's auto-prefix machinery
      (`shouldAutoPrefix`, `AUTO_PREFIX_KINDS`, the `numbering.book`
      flag), #33 extends #22's `injectBookSectionDefaults`, and #40
      adds the `counter:` alias that completes LaTeX-`\newtheorem`
      parity on top of #28's `scope:`. Shipping them as one upstream
      PR avoids the awkward two-step where reviewers see hook points
      before the machinery exists.
    status: pending
    commits:
      - sha: 032957c2
        local_pr: 22
        title: "Book-style numbering: format, label, section-tagged TOC, auto-prefix"
      - sha: 80bb9ecf
        local_pr: 28
        title: "feat(book): section-level scope for proof:* / figure / equation auto-prefix"
      - sha: 043ddcb5
        local_pr: 33
        title: "feat(book): full title→heading chain in injectBookSectionDefaults"
      - sha: a63d53f1
        local_pr: 40
        title: "feat(book): shared counters across proof:* kinds (#34)"
    depends_on: []
    upstream:
      pr: null
      branch: null
      merged_sha: null
    notes: |
      Could be split into smaller upstream PRs if maintainers prefer;
      default plan is one bundled PR. #33 is a direct follow-up to
      #22's injectBookSectionDefaults (extends the per-section wiring
      from heading_1 to the full title→heading_1..6 chain). #40 is a
      direct follow-up to #28's section-scope work — it closes the
      residual counter-share gap so interleaved theorem/lemma/proposition
      enumerators match the LaTeX PDF (LaTeX `\newtheorem{lemma}[theorem]`
      parity). Naturally part of the same upstream story.

  - id: book-parts
    title: Book parts dividers
    description: |
      `section: parts` ParentEntry: emits a Roman-numbered divider folder
      ("Part I — Theory") and wraps chapter groups. Chapter counter
      continues across part boundaries (LaTeX `book` default).
    status: pending
    commits:
      - sha: 5edc040d
        local_pr: 26
        title: "Book parts: section: parts dividers with Roman labels"
    depends_on:
      - book-mode-with-section-scope
    upstream:
      pr: null
      branch: null
      merged_sha: null
    notes: |
      Depends on book-mode being upstream first (or bundled into the same
      upstream PR). Could alternatively fold into `book-mode-with-section-scope`
      to ship the complete book UX as one upstream PR — decide at upstream
      time based on maintainer preference.

  - id: fancy-lists
    title: Pandoc-style fancy ordered lists
    description: |
      Parses Pandoc fancy_lists ordered-list markers — `a.`, `B)`,
      `iv.`, `(i)` — with inferred style/start; `list` nodes carry
      `style`/`delimiter` (myst-spec-ext) rendered by the
      HTML/TeX/Typst/JATS exporters. Plain CommonMark lists keep a
      byte-identical AST (conformance suite unchanged). Vendored
      markdown-it-fancy-lists (MIT) extended with the `(i)` TwoParens
      form.
    status: pending
    commits:
      - sha: 1fd33e3f
        local_pr: 50
        title: "Fancy ordered lists: alphabetic, roman, and parenthesized markers"
    depends_on: []
    upstream:
      pr: null
      branch: null
      merged_sha: null
    notes: |
      Independent of book-mode work; can ship upstream any time. The
      upstream story pairs naturally with a small jupyter-book/myst-theme
      PR mapping list `style` to the <ol type> attribute (tracked in
      QuantEcon/mystmd#51) — mention it in the upstream PR description.
