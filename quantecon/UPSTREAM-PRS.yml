  # ---------------------------------------------------------------------
  # Bug fixes in upstream's own code. Filed as fork issues first; each is
  # fixed and tested here before it becomes an upstream contribution.
  # ---------------------------------------------------------------------

  - id: strict-directive-fileerror
    title: Directive-stage fileError is not counted by `myst build --strict`
    type: bug-fix
    description: |
      A `fileError` raised while a directive runs is logged but never
      reaches the strict check, so a document with a broken directive
      builds clean and exits 0. `loadFile` clears a file's stored
      messages each time it loads the file and then serves the cached
      mdast without re-running the directive, so the message is gone
      before `process/site.ts`'s strict block harvests it via
      `selectFileWarnings`.
    status: planned
    commits: []
    depends_on: []
    upstream:
      issue: null       # not reported upstream; no upstream issue exists as of 2026-09-04
      pr: null
      branch: null
      merged_sha: null
    notes: |
      Fork issue QuantEcon/mystmd#95. Upstream-authored code: both
      `packages/myst-cli/src/process/file.ts` and the 34-line strict block in
      `packages/myst-cli/src/process/site.ts` are byte-identical to
      jupyter-book/mystmd@main (verified 2026-09-04), so this is an upstream
      defect rather than a fork regression.

      Consumer impact beyond the fork: QuantEcon/compliance-lecture-style#28
      plans a `myst build --html --strict` deploy gate that does not do what
      its plan assumes until this is fixed. The datavis plugin family works
      around it by deferring diagnostics through a report step
      (`src/lib/report.mjs`) rather than relying on `fileError`.

  - id: plugin-file-dependencies
    title: Plugins cannot declare a data file as a page dependency
    type: bug-fix
    description: |
      A plugin that reads an external file (a CSV, say) has no way to
      register that file as a dependency of the page it feeds, so
      `myst start` serves stale output after the data changes until the
      source page is itself touched.
    status: planned
    commits: []
    depends_on: []
    upstream:
      issue: null
      pr: null
      branch: null
      merged_sha: null
    notes: |
      Fork issue QuantEcon/mystmd#96. `packages/myst-cli/src/build/site/watch.ts`
      is byte-identical to jupyter-book/mystmd@main (verified 2026-09-04).

      Scope of the damage is the authoring loop only: a fresh `myst build` is
      always current, so deployed output is correct. Affects any data-driven
      plugin family, the datavis primitives included.

  - id: myst-to-tex-grid-card
    title: myst-to-tex silently drops grid/card subtrees from LaTeX export
    type: bug-fix
    description: |
      `myst-to-tex` has no handler for `grid`, `card` or their children.
      A LaTeX export drops the whole subtree with no diagnostic and
      exits 0, so the content is simply absent from the `.tex`.
    status: planned
    commits: []
    depends_on: []
    upstream:
      issue: null
      pr: null
      branch: null
      merged_sha: null
    notes: |
      Fork issue QuantEcon/mystmd#97. `packages/myst-to-tex/src/` carries
      container, legends, math, preamble, proof and tables handlers and no
      grid or card handler at all.

      Falsified a design premise downstream: decision D3 in
      QuantEcon/quantecon-plugins.mystmd#2 assumed core `grid`/`card` were
      portable because they are core node types. The compliance card kit is
      classed as `div` structures instead.

      Worth pairing the handlers with a second change — warn on any node type
      reaching the renderer without a handler — so this whole class of silent
      drop becomes visible rather than needing to be found by diffing output.
