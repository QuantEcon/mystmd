# QuantEcon mystmd build identifier
#
# This file records *which QuantEcon-specific squash commits are in our
# `main`*, identified by `qe-vN` git tags on chosen checkpoint commits.
# It is the diagnostic / traceability artifact — lecture builds can cat
# it to log what fork state they're using.
#
# Upstream status is tracked separately in `UPSTREAM-PRS.yml`. That file
# plans how these squash commits get bundled (or split) into upstream
# PRs, and records the upstream PR / merge status. Cross-reference is
# by commit SHA: each `merge_sha` here appears in some upstream
# candidate's `commits` list there.
#
# Per-PR landing appends the feature to `merged_features` with its squash
# `merge_sha` and `tag: null`. The `tag:` field is filled in later when a
# `qe-vN` tag is cut.
#
# Tags can be cut per-PR (one tag per feature, easy traceability) or
# batched at a checkpoint (one tag covering several merged features
# ready to deploy to book-dp1 / book-dp2 for testing) — pick whichever
# fits the cadence.
# To cut a tag, do the metadata update *first* so the tagged commit's
# tree is self-consistent:
#   1. Open a doc PR updating this file: bump `qe_version` to `qe-v<N+1>`
#      and set `tag: qe-v<N+1>` on each previously-untagged entry in
#      `merged_features` that is included in this tag.
#   2. Squash-merge the doc PR.
#   3. Tag the resulting `main` commit:
#         git tag qe-v<N+1> <sha> -m "qe-v<N+1>: <summary>"
#         git push origin qe-v<N+1>
#
# Doing it in this order means anyone who `cat`s VERSION.yml at tag
# `qe-v<N+1>` sees a self-consistent file (qe_version matches the tag).

qe_version: qe-v5
upstream_base: 1.9.0

merged_features:
  - id: 1
    name: myst-to-ipynb
    description: CommonMark ipynb export + image attachment embedding
    local_pr: 16
    merge_sha: a045d57d
    tag: qe-v1

  - id: 2
    name: book-numbering
    description: Book-style numbering — format, label, section-tagged TOC, auto-prefix
    local_pr: 22
    merge_sha: 032957c2
    tag: qe-v2

  - id: 3
    name: book-proof-scope
    description: Section-level scope for proof:* / figure / equation auto-prefix
    local_pr: 28
    merge_sha: 80bb9ecf
    tag: qe-v3

  - id: 4
    name: book-parts
    description: Book parts dividers (Roman-numbered) with continuous chapter counter
    local_pr: 26
    merge_sha: 5edc040d
    tag: qe-v4

  - id: 5
    name: book-section-heading-chain
    description: Full title→heading_1..6 chain per section in injectBookSectionDefaults
    local_pr: 33
    merge_sha: 043ddcb5
    tag: qe-v5
