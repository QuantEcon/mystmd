# QuantEcon mystmd build identifier
#
# This file records *which QuantEcon-specific squash commits are in our
# `main`*, identified by `qe-vN` git tags on chosen checkpoint commits.
# It is the diagnostic / traceability artifact — lecture builds can cat
# it to log what fork state they're using.
#
# Upstream status is tracked separately in `UPSTREAM-PRS.yml`. That file
# plans how these squash commits get bundled (or split) into upstream
# PRs, and records the upstream PR / merge status. Cross-reference is
# by commit SHA: each `merge_sha` here appears in some upstream
# candidate's `commits` list there.
#
# Per-PR landing appends the feature to `merged_features` with its squash
# `merge_sha` and `tag: null`. The `tag:` field is filled in later when a
# `qe-vN` tag is cut.
#
# Tags are cut at meaningful checkpoints (typically when a batch of
# features is ready for downstream dogfooding), **not per-PR**. When
# cutting a tag:
#   1. Pick the `main` commit at the head of the batch
#   2. Tag it `qe-v<N+1>` and push the tag
#   3. Set `tag: qe-v<N+1>` on each previously-untagged entry in
#      `merged_features` that is included in the batch, then bump
#      `qe_version` to `qe-v<N+1>`

qe_version: qe-v3
upstream_base: 1.9.0

merged_features:
  - id: 1
    name: myst-to-ipynb
    description: CommonMark ipynb export + image attachment embedding
    local_pr: 16
    merge_sha: a045d57d
    tag: qe-v1

  - id: 2
    name: book-numbering
    description: Book-style numbering — format, label, section-tagged TOC, auto-prefix
    local_pr: 22
    merge_sha: 032957c2
    tag: qe-v2

  - id: 3
    name: book-proof-scope
    description: Section-level scope for proof:* / figure / equation auto-prefix
    local_pr: 28
    merge_sha: 80bb9ecf
    tag: qe-v3
