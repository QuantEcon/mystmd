  # mystnb-figure
  - title: A mystnb figure caption and name become the cell's caption and label
    source: |
      ```{code-cell} ipython3
      ---
      mystnb:
        figure:
          caption: A Gaussian random walk
          name: fig-random-walk
      tags: [hide-input]
      ---
      plt.show()
      ```
    result: |
      ```{code-cell} ipython3
      ---
      label: fig-random-walk
      caption: A Gaussian random walk
      tags: [hide-input]
      ---
      plt.show()
      ```
  - title: A caption that needs quoting stays valid YAML
    source: |
      ```{code-cell} ipython3
      ---
      mystnb:
        figure:
          caption: 'Wealth: the top 1%'
      ---
      plt.show()
      ```
    result: |
      ```{code-cell} ipython3
      ---
      caption: 'Wealth: the top 1%'
      ---
      plt.show()
      ```
  - title: A code cell with a label and a caption is left alone
    source: |
      ```{code-cell} ipython3
      ---
